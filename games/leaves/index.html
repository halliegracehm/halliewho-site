<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catch the Falling Leaves | Flamie's Leafy Games</title>
<meta name="description" content="A free counting game for little ones: tap the autumn leaves as they float down.">
<meta name="theme-color" content="#FFE066">
<link rel="icon" href="../flamie.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit.css">
<style>
  .field {
    position: relative; height: min(62vh, 560px); min-height: 360px; border-radius: 28px; overflow: hidden;
    background: linear-gradient(180deg, #FFF3B0 0%, #FFE066 60%, #FFD447 100%);
    box-shadow: var(--shadow); touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .leaf {
    position: absolute; left: 0; top: 0; width: 76px; height: 76px; padding: 4px;
    will-change: transform;
  }
  .leaf svg { width: 100%; height: 100%; pointer-events: none; }
  .poof { position: absolute; font-family: var(--head); font-weight: 800; font-size: 34px; color: var(--berry); pointer-events: none; animation: poof .8s ease-out forwards; text-shadow: 0 2px 0 var(--cream); }
  @keyframes poof { from { transform: translate(-50%, -50%) scale(.6); opacity: 1; } to { transform: translate(-50%, -140%) scale(1.3); opacity: 0; } }
  .count { position: absolute; right: 12px; bottom: 12px; z-index: 2; font-family: var(--head); font-weight: 800; font-size: 28px; color: var(--bark); background: var(--cream); border-radius: 999px; padding: 6px 16px 2px; box-shadow: var(--shadow); }
  .start { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(255,248,234,.55); text-align: center; padding: 20px; }
  .start p { font-family: var(--head); font-weight: 800; font-size: 24px; line-height: 1.15; color: var(--bark); max-width: 280px; }
  .start .flamie { width: 92px; height: 92px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="bar">
    <a class="pill" href="../">&larr; Games</a>
    <div class="title">Falling Leaves</div>
    <button class="pill icon-btn" id="mute" type="button"></button>
    <span class="pill stars" id="stars" aria-label="Stars collected"></span>
  </div>

  <div class="choices" role="group" aria-label="Pick a speed">
    <button class="chip" data-speed="1" aria-pressed="true">Slow</button>
    <button class="chip" data-speed="1.6" aria-pressed="false">Breezy</button>
    <button class="chip" data-speed="2.3" aria-pressed="false">Windy</button>
  </div>

  <div class="progress" id="progress"></div>

  <div class="field" id="field">
    <svg class="scene" viewBox="0 0 400 560" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path d="M0 470C80 440 160 450 220 462S340 470 400 450V560H0Z" fill="#7CC243" stroke="#4A2A1B" stroke-width="3"/>
      <path d="M-20 500C60 486 120 492 200 504S330 512 420 494V560H-20Z" fill="#6AB236"/>
      <path d="M318 470c-6-60 0-130 4-180-14-20-40-30-62-26 24-12 46-6 62 10 4-26-6-50-24-62 26 8 38 34 36 60 12-20 34-28 54-24-22 6-38 22-44 42-6 56-6 120 4 180Z" fill="#7A4A2B" stroke="#4A2A1B" stroke-width="3" stroke-linejoin="round"/>
      <g stroke="#4A2A1B" stroke-width="3">
        <circle cx="300" cy="160" r="64" fill="#F08A24"/><circle cx="360" cy="120" r="56" fill="#C7364F"/>
        <circle cx="250" cy="110" r="48" fill="#E9839A"/><circle cx="330" cy="70" r="50" fill="#F7C531"/>
        <circle cx="390" cy="190" r="46" fill="#F08A24"/>
      </g>
      <g fill="#4E8F2A"><path d="M40 470l6-20 4 20M120 466l5-18 5 18M200 470l6-22 4 22"/></g>
    </svg>
    <div class="count" id="count" aria-live="polite">0</div>
    <div class="start" id="start">
      <div class="flamie" role="img" aria-label="Flamie the owl"></div>
      <p>Help Flamie catch the leaves! Tap them before they land.</p>
      <button class="btn green" id="go" type="button">Let's go!</button>
    </div>
  </div>
  <p class="hint-text">Catch 15 leaves to fill your leaf pile.</p>
</main>
<script src="../kit.js"></script>
<script>
  const { ART, play, say, LEAF_COLORS } = Kit;
  const GOAL = 15;
  const NUMS = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen"];
  const field = document.getElementById("field");
  const countEl = document.getElementById("count");
  const start = document.getElementById("start");
  const setProgress = Kit.progress(document.getElementById("progress"), GOAL);

  let leaves = [], caught = 0, speed = 1, running = false, last = 0, spawnIn = 0;

  function spawn() {
    const w = field.clientWidth;
    const el = document.createElement("button");
    el.type = "button"; el.className = "leaf"; el.setAttribute("aria-label", "Leaf");
    const c = LEAF_COLORS[Math.floor(Math.random() * 4)];
    el.innerHTML = Math.random() < .5 ? ART.maple(c) : ART.leaf(c);
    const leaf = { el, x: 10 + Math.random() * (w - 96), y: -80, t: Math.random() * 6, vy: 42 + Math.random() * 18, rot: Math.random() * 360, spin: (Math.random() - .5) * 60 };
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); catchLeaf(leaf); });
    field.appendChild(el);
    leaves.push(leaf);
  }

  function catchLeaf(leaf) {
    if (!running || leaf.gone) return;
    leaf.gone = true; leaf.el.remove();
    caught++; countEl.textContent = caught; setProgress(caught); play("pop");
    if (caught <= 15) say(NUMS[caught]);
    const p = document.createElement("div");
    p.className = "poof"; p.textContent = caught;
    p.style.left = leaf.x + 38 + "px"; p.style.top = leaf.y + 38 + "px";
    field.appendChild(p); setTimeout(() => p.remove(), 800);
    if (caught >= GOAL) {
      running = false;
      setTimeout(() => { clear(); Kit.win({ title: "Leaf pile!", text: `You caught ${GOAL} leaves. Time to jump in!`, again: begin }); }, 500);
    }
  }

  function tick(now) {
    if (!running) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const h = field.clientHeight;
    spawnIn -= dt;
    if (spawnIn <= 0 && leaves.length < 5) { spawn(); spawnIn = 1.5 / speed; }
    leaves.forEach((l) => {
      l.t += dt; l.y += l.vy * speed * dt; l.rot += l.spin * dt;
      const sway = Math.sin(l.t * 1.4) * 26;
      l.el.style.transform = `translate(${l.x + sway}px, ${l.y}px) rotate(${l.rot}deg)`;
      if (l.y > h - 40 && !l.gone) { l.gone = true; l.el.style.transition = "opacity .5s"; l.el.style.opacity = "0"; setTimeout(() => l.el.remove(), 500); }
    });
    leaves = leaves.filter((l) => !l.gone);
    requestAnimationFrame(tick);
  }

  function clear() { field.querySelectorAll(".leaf").forEach((e) => e.remove()); leaves = []; }

  function begin() {
    clear(); caught = 0; countEl.textContent = "0"; setProgress(0);
    start.style.display = "none"; running = true; spawnIn = 0; last = performance.now();
    requestAnimationFrame(tick);
  }

  document.getElementById("go").onclick = begin;
  document.querySelectorAll(".chip").forEach((c) => c.onclick = () => {
    document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x === c));
    speed = +c.dataset.speed;
  });
</script>
</body>
</html>
